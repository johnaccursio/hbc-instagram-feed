name: Sync Instagram

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes, GitHub's shortest schedule (runs can be delayed)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the latest posts and stories
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          FEED_KEY: ${{ secrets.FEED_KEY }}
        run: python3 sync_instagram.py
      - name: Publish posts
        if: always()
        run: |
          git config user.name "hbc-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feed.json media status.json token.enc 2>/dev/null || true
          # status.json changes every run; commit only when something else
          # changed, plus once a day so the schedule stays active.
          if git diff --cached --quiet -- feed.json media token.enc && [ "$(date -u +%H%M)" -ge 0005 ]; then
            git reset -q
            echo "No new posts to publish."
          else
            git commit -qm "Update Instagram feed" && git push -q
          fi
      - name: Publish stories (replaces the stories branch)
        if: always()
        run: |
          [ -f stories/stories.json ] || { echo "No stories data this run."; exit 0; }
          git fetch -q origin stories 2>/dev/null || true
          OLD=$(git rev-parse -q --verify "origin/stories^{tree}" || echo none)
          export GIT_INDEX_FILE="$RUNNER_TEMP/stories.index"
          rm -f "$GIT_INDEX_FILE"
          for f in stories/*; do
            h=$(git hash-object -w "$f")
            git update-index --add --cacheinfo 100644 "$h" "$(basename "$f")"
          done
          NEW=$(git write-tree)
          if [ "$NEW" = "$OLD" ]; then echo "Stories unchanged."; exit 0; fi
          C=$(git commit-tree "$NEW" -m "Active Instagram stories")
          git push -q -f origin "$C:refs/heads/stories"
          echo "Published stories."
